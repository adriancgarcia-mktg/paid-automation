google:
  monthly_budget: 50000                     # $8K + $32K + $10K campaigns
  campaigns:
    - name: Search_Brand_US
      type: search
      daily_budget_micros: 266666667        # $8K/mo / 30 = $266.67/day
      bidding: TARGET_CPA
      target_cpa_micros: 200000000          # documented Brand exception at $200
      match_types: [exact, phrase]
      status: PAUSED
      ad_groups:
        - name: Brand_Core
          type: Standard
          keywords: ["[brand term 1]", "[brand term 2]"]
          ads:
            - name: Brand_RSA_A
              type: Responsive search ad
              headlines: ["[Headline 1]", "[Headline 2]", "[Headline 3]"]
              descriptions: ["[Description 1]", "[Description 2]"]
              landing_url: https://example.com/signup
              path1: start
              path2: trial
    - name: Search_NonBrand_US
      type: search
      daily_budget_micros: 1066666667       # $32K/mo / 30 = $1,066.67/day
      bidding: MAXIMIZE_CONVERSIONS
      tcpa_deferred_until: "30 conversions/month sustained, then tCPA 280 via plan edit"
      negatives: 40_plus_list               # resolved from Change_Log plus audit flags
      match_types: [exact, phrase]
      status: PAUSED
      ad_groups:
        - name: NonBrand_Core
          type: Standard
          keywords: ["[non-brand term 1]", "[non-brand term 2]"]
          ads:
            - name: NonBrand_RSA_A
              type: Responsive search ad
              headlines: ["[Headline 1]", "[Headline 2]", "[Headline 3]"]
              descriptions: ["[Description 1]", "[Description 2]"]
              landing_url: https://example.com/signup
              path1: start
              path2: trial
    - name: PMax_US
      type: pmax
      daily_budget_micros: 333333333        # $10K/mo / 30 = $333.33/day
      bidding: TARGET_CPA
      target_cpa_micros: 280000000
      brand_negation: true
      probation_days: 21
      kill_condition: "CPA > 280 for 7 consecutive days after day 14"
      status: PAUSED
      ad_groups:
        - name: PMax_Core
          type: Asset group
          keywords: []
          ads:
            - name: PMax_Assets_A
              type: Asset group
              headlines: ["[Headline 1]", "[Headline 2]", "[Headline 3]"]
              descriptions: ["[Description 1]", "[Description 2]"]
              landing_url: https://example.com/signup
              path1: start
              path2: trial

reserve:
  monthly_budget: 5000
  release_condition: "US NonBrand holds CPA <= 280 for 14 consecutive days"
