# Approved campaign plan: the single source of truth for every build.
# SAMPLE VALUES. Replace brand terms, URLs, copy and asset IDs with real ones.
# Builders refuse any plan whose plan_status is not APPROVED.
plan_status: APPROVED
monthly_cap: 120000
brand_terms: ["[brand term 1]", "[brand term 2]"]

